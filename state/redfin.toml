# Desired state of the redfin phone. Edit in git, then `state apply` (tools/state.py, state/README.md).
[meta]
schema = 1
device = "redfin"
adopted = "2026-11-14T16:57:12Z"
from_dump = "state/snapshots/2026-11-14T1650Z-adopt.dump"
note = "bootstrapped by state.py adopt; source = \"unknown\" entries need a decision (resolve or retire)"
known_good_baseline = """
=== BASELINE 2026-11-14 (boot rbb2b) ===
Kernel ws-n-bba2 7100798 (builds/xnu/ws-n-bba2-7100798df6, sha256 33bb5524..., klog PA 0x101d76f18), base r5p3a, cmdline.bb19u15. Lacks 1094.
Plug-in RedwoodAudio s4 a93b1bb (sha256 3638a0ca...), backup RedwoodAudio.pre-s4 (aa51598a... = dcc81fd).
Runtime: voice_proxy 0 (OLD direct audio active), pace 1, opts 0, bbv_service 0, voice_opts 1920, qmi_rules 0, qmi_vocoder 0, data_fwd 0, gains 0/0.
Flags: redwood-call-route=4, sweetpin.off (native SIM PIN works), sweetcell.conf hooks=0.
Works: native SIM PIN, calls (2-way audio), SMS, Wi-Fi (manual join), BT media. Data BLOCKED (activation gate). Bars missing on home/lock screen.
Arm new call audio: sctl bbv_service 1; sctl voice_proxy 2; restart mediaserverd. Not promoted (no regression, no 1094).
Handover doc: claude/redfin-handover-2026-11-14.md
2026-11-14 hm-int2 504c000 install: backups /System/Library/Extensions/SweetMetal2.bundle -> /var/local/hmetal/SweetMetal2-shim.bundle.knowngood-6740748; /var/local/hmetal/lib/HakiosMetal.bundle -> /var/local/hmetal/lib/HakiosMetal.bundle.knowngood-var12; /var/local/hmetal/ca/env -> /var/local/hmetal/ca/env.knowngood-var12; /var/local/hmetal/m2-fallback -> /var/local/hmetal/m2-fallback.pre-int2"""

# What runs: image/kernel/cmdline. Never applied by state.py (no reboots): `cycle` / `boot` do that; diff checks kern.uuid and kern.bootargs.
[boot]
image = "rbb2b"
base = "r5p3a"
kernel_dir = "builds/xnu/ws-n-bba2-7100798df6"
kernel_branch = "ws-n-bba2"
kernel_sha = "7100798df600e7862abe7c4f4b90fe0dfda64685"
kernel_uuid = "39034499-485D-3BAF-A4D6-C1C245D81EE3"
cmdline_file = "agent/stage/cmdline.bb19u15"
bootargs = "debug=0xc serial=3 cpus=8 keepsyms=1 rd=ufsroot0 ufsrw=1 rootrw=1 unentitled_ios_sim_launch=1 ignition_level=1 launchd_unsecure_cache=1 wdt=-1 sweetfb_noconsole=1 sweetfb_hz=90 ufslogsecs=2 sweetusb=2 sweetgpufreq=4 sweetbattery=1 sweetgpu=1 sweetmtl=2 sectouch=1 sweethaptic=2 sweetbl=1 sweetnull=backboardd sweettorch=2 sweetcam=2 sweetcamdev=1 flamecpufreq=2 sweetbig=2 adsp=2 adsp_sleep=1 sndgpio=1 sound=4 mic=1 micgain=51 sweetbtnub=7 btbridge=1 sweetfbx=0x107 sectouchx=0xd sweetfbflip=1 sweetgov=4060 sweetscanout=2 sweetrtcoff=1792779327 xram=3 sweetabp=15 sweetbb=19 sweetufs=15"

# Paths state.py may write (roots) and how the dump is read. Outside roots or under firmware: apply refuses.
[managed]
roots = [
  "/var/local",
  "/System/Library/Extensions/SweetMetal2.bundle",
  "/System/Library/Audio/Plug-Ins/HAL/RedwoodAudio.driver",
  "/System/Library/xpc",
  "/Applications/SweetControl.app",
  "/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache/Library/Caches",
]
ignore = [
  "/var/local/scratch/*",
  "/var/local/tmp/*",
  "/var/local/m2v-cache/*",
  "/var/local/hmetal/cache/*",
  "/var/local/hmetal/log/*",
  "/var/local/hmetal/dump/*",
  "/var/local/fw/rmtfs/*",
]
volatile = [
  "*.log",
  "/var/local/wland.log.prev",
  "/var/local/cell.status",
  "/var/local/wland.boot",
  "/var/local/wland.ipa",
  "/var/local/hmetal/ca/bbd-hm.starts",
  "/var/local/hmetal/ca/bbd-hm",
  "/var/local/sweetctl/changes.log",
  "/var/local/modem-profiles-*.bak",
  "/var/local/ipa-ulflt.bin",
  "/var/local/sensd-probe.log",
  "/var/local/sweetmon.key",
  "/var/local/sweethud",
  "*.log.[0-9]",
  "/var/local/hmetal/m2-fallback",
  "/private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache/Library/Caches/*",
]
stock = [
  "/System/Library/xpc/extensions.plist",
  "/System/Library/xpc/extensions.plist.sig",
  "/System/Library/xpc/launchd.plist.sig",
]
firmware = [
  "/var/local/fw",
  "/var/local/fw/*",
  "/var/local/hexagon",
  "/var/local/hexagon/*",
  "/dev/*",
]
secret = [
  "/var/local/abp-policy.conf*",
  "/var/local/modem-profiles-*",
  "*.key",
  "*MobileGestalt*",
  "/var/local/fw/rmtfs/*",
]
nohash = [
  "./SweetMetal2.bundle.*",
  "./RedwoodAudio.driver.*",
  "./knowngood-r5au1s",
  "./knowngood-r5au1s/*",
  "./hmetal/ca/HakiosMetal.bundle.*",
  "./hmetal/ca/shim.*",
  "./hexagon.t*",
  "./launchd.plist.*",
  "./wland.log.*",
  "./btd.log.*",
  "./*.text",
  "./*.nv12",
  "./*.pre-*",
]
scratch = "/var/local/scratch"

